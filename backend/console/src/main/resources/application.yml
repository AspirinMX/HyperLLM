server:
  port: ${CONSOLE_PORT:8081}

spring:
  application:
    name: hyperllm-console
  threads:
    virtual:
      enabled: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:hyperllm}
    username: ${POSTGRES_USER:hyperllm}
    password: ${POSTGRES_PASSWORD:hyperllm}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 4
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

hyperllm:
  security:
    console-jwt-secret: ${HYPERLLM_CONSOLE_JWT_SECRET}
    aes-master-key: ${HYPERLLM_AES_MASTER_KEY}
    key-pepper-v1: ${HYPERLLM_KEY_PEPPER_V1}
    cookie-secure: ${HYPERLLM_COOKIE_SECURE:false}
  billing:
    signup-bonus-micros: ${HYPERLLM_SIGNUP_BONUS_MICROS:5000000}
  auth:
    otp-debug-echo-enabled: ${HYPERLLM_OTP_DEBUG_ECHO:false}
  payment:
    public-base-url: ${HYPERLLM_PUBLIC_BASE_URL:http://localhost:8081}
    order-ttl-minutes: ${HYPERLLM_PAYMENT_ORDER_TTL_MINUTES:30}
    notification-tolerance-seconds: ${HYPERLLM_PAYMENT_NOTIFICATION_TOLERANCE_SECONDS:300}
    voucher-code-pepper: ${HYPERLLM_VOUCHER_CODE_PEPPER:}
    fx-rates:
      USD: 1
      CNY: ${HYPERLLM_FX_CNY_PER_USD:0.14}
    stripe:
      enabled: ${HYPERLLM_STRIPE_ENABLED:false}
      secret-key: ${HYPERLLM_STRIPE_SECRET_KEY:}
      webhook-secret: ${HYPERLLM_STRIPE_WEBHOOK_SECRET:}
      success-url: ${HYPERLLM_STRIPE_SUCCESS_URL:/payment/return}
      cancel-url: ${HYPERLLM_STRIPE_CANCEL_URL:/payment/cancel}
    alipay:
      enabled: ${HYPERLLM_ALIPAY_ENABLED:false}
      app-id: ${HYPERLLM_ALIPAY_APP_ID:}
      merchant-private-key: ${HYPERLLM_ALIPAY_MERCHANT_PRIVATE_KEY:}
      alipay-public-key: ${HYPERLLM_ALIPAY_PUBLIC_KEY:}
      notify-url: ${HYPERLLM_ALIPAY_NOTIFY_URL:http://localhost:8081/api/v1/payment-notifications/alipay}
      return-url: ${HYPERLLM_ALIPAY_RETURN_URL:/payment/return}
    wechat:
      enabled: ${HYPERLLM_WECHAT_PAY_ENABLED:false}
      merchant-id: ${HYPERLLM_WECHAT_MERCHANT_ID:}
      app-id: ${HYPERLLM_WECHAT_APP_ID:}
      merchant-serial-number: ${HYPERLLM_WECHAT_MERCHANT_SERIAL:}
      merchant-private-key: ${HYPERLLM_WECHAT_MERCHANT_PRIVATE_KEY:}
      api-v3-key: ${HYPERLLM_WECHAT_API_V3_KEY:}
      platform-public-key: ${HYPERLLM_WECHAT_PLATFORM_PUBLIC_KEY:}
      notify-url: ${HYPERLLM_WECHAT_NOTIFY_URL:http://localhost:8081/api/v1/payment-notifications/wechat-pay}
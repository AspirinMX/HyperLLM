server:
  port: ${ADMIN_PORT:8082}

spring:
  application:
    name: hyperllm-admin
  threads:
    virtual:
      enabled: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:hyperllm}
    username: ${POSTGRES_USER:hyperllm}
    password: ${POSTGRES_PASSWORD:hyperllm}
    hikari:
      maximum-pool-size: 16
      minimum-idle: 4
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: hyperllm-admin-billing
      enable-auto-commit: false
    listener:
      # BillingSettlementConsumer takes an Acknowledgment argument; Spring only populates it
      # for manual ack modes, so BATCH would fail every message before it reaches the ledger.
      ack-mode: manual

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

hyperllm:
  security:
    admin-jwt-secret: ${HYPERLLM_ADMIN_JWT_SECRET}
    aes-master-key: ${HYPERLLM_AES_MASTER_KEY}
    key-pepper-v1: ${HYPERLLM_KEY_PEPPER_V1}
    cookie-secure: ${HYPERLLM_COOKIE_SECURE:false}
  admin:
    mfa:
      required: ${HYPERLLM_ADMIN_MFA_REQUIRED:true}
    bootstrap:
      email: ${HYPERLLM_BOOTSTRAP_ADMIN_EMAIL:}
      password: ${HYPERLLM_BOOTSTRAP_ADMIN_PASSWORD:}

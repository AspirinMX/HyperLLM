name: hyperllm

services:
  postgres:
    image: postgres:16-alpine
    container_name: hyperllm-postgres
    restart: unless-stopped
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hyperllm}
      POSTGRES_USER: ${POSTGRES_USER:-hyperllm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hyperllm_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hyperllm} -d ${POSTGRES_DB:-hyperllm}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: hyperllm-redis
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        if [ -n "${REDIS_PASSWORD:-}" ]; then
          exec redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}"
        else
          exec redis-server --appendonly yes
        fi
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"${REDIS_PASSWORD:-}\" ]; then redis-cli -a \"${REDIS_PASSWORD}\" ping; else redis-cli ping; fi | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12

  kafka:
    image: apache/kafka:3.9.0
    container_name: hyperllm-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_EXTERNAL_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9092}:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15

  kafka-init:
    image: apache/kafka:3.9.0
    container_name: hyperllm-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_INTERNAL_BOOTSTRAP: kafka:29092
    volumes:
      - ./kafka/create-topics.sh:/etc/hyperllm/create-topics.sh:ro
    entrypoint: ["bash", "/etc/hyperllm/create-topics.sh"]
    restart: "no"

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: hyperllm-clickhouse
    profiles: ["pipeline"]
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-hyperllm}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-hyperllm}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-hyperllm_dev_password}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 5s
      retries: 12

  debezium:
    image: quay.io/debezium/connect:2.7
    container_name: hyperllm-debezium
    profiles: ["pipeline"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: hyperllm-debezium-cluster
      CONFIG_STORAGE_TOPIC: _hyperllm_connect_configs
      OFFSET_STORAGE_TOPIC: _hyperllm_connect_offsets
      STATUS_STORAGE_TOPIC: _hyperllm_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    ports:
      - "${DEBEZIUM_PORT:-8083}:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  debezium-init:
    image: curlimages/curl:8.11.0
    container_name: hyperllm-debezium-init
    profiles: ["pipeline"]
    depends_on:
      debezium:
        condition: service_healthy
    environment:
      DEBEZIUM_URL: http://debezium:8083
      POSTGRES_DB: ${POSTGRES_DB:-hyperllm}
      POSTGRES_USER: ${POSTGRES_USER:-hyperllm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hyperllm_dev_password}
      ENABLE_OUTBOX_CONNECTOR: ${ENABLE_OUTBOX_CONNECTOR:-true}
    volumes:
      - ./debezium:/etc/hyperllm/debezium:ro
    entrypoint: ["sh", "/etc/hyperllm/debezium/register-connectors.sh"]
    restart: "no"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    container_name: hyperllm-otel-collector
    profiles: ["observability"]
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: hyperllm-prometheus
    profiles: ["observability"]
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:11.3.0
    container_name: hyperllm-grafana
    profiles: ["observability"]
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "${GRAFANA_PORT:-3100}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: hyperllm-kafka-ui
    profiles: ["tools"]
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: hyperllm-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "${KAFKA_UI_PORT:-8088}:8080"

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  clickhouse_data:
  prometheus_data:
  grafana_data:
